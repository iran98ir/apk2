name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'config.json'
      - 'icon.png'
      - 'icon_round.png'
      - 'font/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          for f in config.json icon.png icon_round.png font/lalezar.ttf; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f"
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pillow cairosvg

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare resources from config.json
        run: python scripts/prepare.py

      - name: Generate temporary keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/temp.jks \
            -storepass temp1234 \
            -keypass temp1234 \
            -alias tempkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, S=Temp, C=IR"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/keystore/temp.jks \
            -Pandroid.injected.signing.store.password=temp1234 \
            -Pandroid.injected.signing.key.alias=tempkey \
            -Pandroid.injected.signing.key.password=temp1234

      - name: Get app info
        id: appinfo
        run: |
          NAME=$(python -c "import json;print(json.load(open('config.json'))['brand']['name'])")
          PKG=$(python -c "import json;print(json.load(open('config.json'))['brand']['pkg'])")
          VCODE=$(python -c "import json;print(json.load(open('config.json'))['brand']['vcode'])")
          MODE=$(python -c "import json;print(json.load(open('config.json'))['brand']['mode'])")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "pkg=$PKG" >> $GITHUB_OUTPUT
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          DST="app/build/outputs/apk/release/${{ steps.appinfo.outputs.pkg }}-${{ steps.appinfo.outputs.vcode }}.apk"
          mv "$SRC" "$DST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.appinfo.outputs.pkg }}-${{ steps.appinfo.outputs.vcode }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
